<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Todo List</title>
  </head>

  <body>
    <header class="mobile-header">
      <button id="menu-toggle">☰ Projects</button>
    </header>

    <sidebar>
      <ul id="projects-list"></ul>
    </sidebar>

    <main id="content">
      <h1 id="project-name"></h1>
      <div class="input-group">
        <button id="add-todo">Add New Task</button>
        <button id="create-project">Create New Project</button>
      </div>
      <ul id="todo-list"></ul>
    </main>

    <dialog id="main-dialog">
      <div id="dialog-content"></div>
    </dialog>
  </body>
</html>
